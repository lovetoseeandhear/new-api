<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script
      type="module"
      crossorigin
      src="/home/assets/index-WVDRaFx5.js"
    ></script>
    <link rel="stylesheet" crossorigin href="/home/assets/index-CIGFnVdR.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        function replaceBrandLogos() {
          var brandLabels = Array.prototype.slice
            .call(document.querySelectorAll('span'))
            .filter(function (node) {
              return (node.textContent || '').trim() === 'Flowbay API';
            });

          brandLabels.forEach(function (label) {
            var logoWrap = label.previousElementSibling;
            if (
              !logoWrap ||
              logoWrap.getAttribute('data-new-api-logo') === 'true'
            )
              return;

            logoWrap.setAttribute('data-new-api-logo', 'true');
            logoWrap.innerHTML =
              '<img src="/logo.png" alt="new-api" style="width:100%;height:100%;object-fit:contain;border-radius:inherit;" />';
            logoWrap.style.background = 'transparent';
          });
        }

        function restyleGatewayCard() {
          var gatewayTitle = Array.prototype.slice
            .call(document.querySelectorAll('h3'))
            .find(function (node) {
              return (node.textContent || '').trim() === '异构网关 统一融合';
            });
          if (!gatewayTitle) return;

          var card = gatewayTitle.parentElement;
          while (
            card &&
            (!card.className ||
              String(card.className).indexOf('lg:col-span-2') === -1)
          ) {
            card = card.parentElement;
          }
          if (
            !card ||
            card.getAttribute('data-new-api-gateway-style') === 'true'
          )
            return;

          card.setAttribute('data-new-api-gateway-style', 'true');
          card.style.background =
            'linear-gradient(135deg, rgba(10,12,16,0.98) 0%, rgba(15,23,42,0.96) 44%, rgba(17,24,39,0.95) 100%)';
          card.style.border = '1px solid rgba(34,211,238,0.16)';
          card.style.boxShadow =
            '0 22px 60px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.06)';

          gatewayTitle.style.color = '#f8fafc';
          gatewayTitle.style.textShadow = '0 0 24px rgba(34,211,238,0.18)';

          var description = gatewayTitle.nextElementSibling;
          if (description) {
            description.style.color = 'rgba(203,213,225,0.86)';
          }

          Array.prototype.slice.call(card.children).forEach(function (child) {
            var className = String(child.className || '');
            if (
              className.indexOf('top-0') !== -1 &&
              className.indexOf('right-0') !== -1
            ) {
              child.style.background =
                'radial-gradient(circle, rgba(34,211,238,0.18), rgba(139,92,246,0.10) 42%, transparent 70%)';
              child.style.opacity = '1';
            }
          });
        }

        function restyleTrustBlocks() {
          if (!document.getElementById('new-api-trust-blocks-style')) {
            var style = document.createElement('style');
            style.id = 'new-api-trust-blocks-style';
            style.textContent = [
              '.new-api-trust-grid{max-width:72rem!important;width:100%;}',
              '.new-api-trust-grid-primary{margin-top:3.75rem!important;gap:1rem!important;}',
              '.new-api-trust-grid-secondary{margin-top:1rem!important;padding:0!important;background:transparent!important;border:0!important;backdrop-filter:none!important;gap:1rem!important;divide:none!important;}',
              '.new-api-trust-card{min-height:156px;text-align:left!important;background:linear-gradient(135deg,rgba(10,12,16,.66),rgba(15,23,42,.48))!important;border:1px solid rgba(255,255,255,.065)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 18px 48px rgba(0,0,0,.18)!important;}',
              '.new-api-trust-card:hover{border-color:rgba(34,211,238,.18)!important;background:linear-gradient(135deg,rgba(10,12,16,.78),rgba(15,23,42,.58))!important;}',
              '.new-api-trust-card-icon{margin-left:0!important;margin-right:0!important;}',
              '.new-api-trust-mini{min-height:132px;padding:1.25rem!important;border:1px solid rgba(255,255,255,.065)!important;border-radius:1rem;background:linear-gradient(135deg,rgba(255,255,255,.025),rgba(15,23,42,.32));box-shadow:inset 0 1px 0 rgba(255,255,255,.035);}',
              '.new-api-trust-mini{padding-top:1.25rem!important;padding-left:1.25rem!important;padding-right:1.25rem!important;}',
              '.new-api-trust-mini + .new-api-trust-mini{border-left:1px solid rgba(255,255,255,.065)!important;}',
              '@media(max-width:767px){.new-api-trust-grid-primary,.new-api-trust-grid-secondary{max-width:28rem!important;grid-template-columns:1fr!important;}.new-api-trust-mini{min-height:auto;}.new-api-trust-mini + .new-api-trust-mini{border-left:1px solid rgba(255,255,255,.065)!important;}}',
            ].join('');
            document.head.appendChild(style);
          }

          var complianceTitle = Array.prototype.slice
            .call(document.querySelectorAll('h4'))
            .find(function (node) {
              return (node.textContent || '').trim() === '业务监管合规';
            });
          if (!complianceTitle) return;

          var firstCard = complianceTitle.parentElement;
          while (
            firstCard &&
            (!firstCard.className ||
              String(firstCard.className).indexOf('glass-card') === -1)
          ) {
            firstCard = firstCard.parentElement;
          }
          if (!firstCard) return;

          var primaryGrid = firstCard.parentElement;
          if (
            primaryGrid &&
            primaryGrid.getAttribute('data-new-api-trust-primary') !== 'true'
          ) {
            primaryGrid.setAttribute('data-new-api-trust-primary', 'true');
            primaryGrid.classList.add(
              'new-api-trust-grid',
              'new-api-trust-grid-primary',
            );
            Array.prototype.slice
              .call(primaryGrid.children)
              .forEach(function (card) {
                card.classList.add('new-api-trust-card');
                var iconWrap = card.querySelector('div');
                if (iconWrap) iconWrap.classList.add('new-api-trust-card-icon');
              });
          }

          var nodeLabel = Array.prototype.slice
            .call(document.querySelectorAll('span'))
            .find(function (node) {
              return (node.textContent || '').trim() === '国内直连 · 全球节点';
            });
          if (!nodeLabel) return;

          var miniCard = nodeLabel.parentElement;
          while (
            miniCard &&
            (!miniCard.parentElement ||
              String(miniCard.parentElement.className || '').indexOf('grid') ===
                -1)
          ) {
            miniCard = miniCard.parentElement;
          }
          var secondaryGrid = miniCard && miniCard.parentElement;
          if (
            secondaryGrid &&
            secondaryGrid.getAttribute('data-new-api-trust-secondary') !==
              'true'
          ) {
            secondaryGrid.setAttribute('data-new-api-trust-secondary', 'true');
            secondaryGrid.classList.add(
              'new-api-trust-grid',
              'new-api-trust-grid-secondary',
            );
            Array.prototype.slice
              .call(secondaryGrid.children)
              .forEach(function (card) {
                card.classList.add('new-api-trust-mini');
              });
          }
        }

        function applyHomeAdjustments() {
          replaceBrandLogos();
          restyleGatewayCard();
          restyleTrustBlocks();
        }

        applyHomeAdjustments();
        var homeObserver = new MutationObserver(applyHomeAdjustments);
        homeObserver.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
