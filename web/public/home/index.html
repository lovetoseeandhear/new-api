        var modelShowcaseLoaded = false;

        function getVendorById(vendors, vendorId) {
          if (!vendors || vendorId === undefined || vendorId === null)
            return null;

          if (Array.isArray(vendors)) {
            return (
              vendors.find(function (vendor) {
                return String(vendor.id) === String(vendorId);
              }) || null
            );
          }

          return vendors[String(vendorId)] || vendors[vendorId] || null;
        }

        function getVendorName(model, vendors) {
          var vendor = getVendorById(vendors, model && model.vendor_id);
          if (vendor && vendor.name) return vendor.name;
          if (model && model.icon) return String(model.icon).split('.')[0];
          var name = (
            model && model.model_name ? model.model_name : ''
          ).toLowerCase();
          if (name.indexOf('claude') !== -1) return 'Anthropic';
          if (name.indexOf('gemini') !== -1) return 'Google';
          if (name.indexOf('gpt') !== -1 || name.indexOf('o4') !== -1)
            return 'OpenAI';
          return 'AI Model';
        }

        function getDiscountZhe(groupRatio) {
          var ratio = Number(groupRatio);
          if (!Number.isFinite(ratio)) return null;
          var zhe = Math.max(0, Math.min(10, (ratio / 6.8) * 10));
          return Number(zhe.toFixed(1));
        }

        function formatRatio(value) {
          var ratio = Number(value);
          if (!Number.isFinite(ratio)) return '-';
          if (ratio >= 10) return ratio.toFixed(2).replace(/\.?0+$/, '') + 'x';
          if (ratio >= 1) return ratio.toFixed(3).replace(/\.?0+$/, '') + 'x';
          return ratio.toFixed(4).replace(/0+$/, '').replace(/\.$/, '') + 'x';
        }

        function pickPrimaryGroup(model, groupRatio) {
          var groups = Array.isArray(model.enable_groups)
            ? model.enable_groups
            : [];
          var selected = groups[0] || '默认分组';
          var selectedRatio = groupRatio && groupRatio[selected];

          groups.forEach(function (group) {
            var ratio = groupRatio && groupRatio[group];
            if (
              ratio !== undefined &&
              (selectedRatio === undefined || ratio < selectedRatio)
            ) {
              selected = group;
              selectedRatio = ratio;
            }
          });

          return {
            name: selected,
            ratio: selectedRatio === undefined ? 1 : selectedRatio,
          };
        }

        function getModelFamily(name) {
          var lower = String(name || '').toLowerCase();
          if (lower.indexOf('gpt') !== -1) return 'gpt';
          if (lower.indexOf('claude') !== -1) return 'claude';
          if (lower.indexOf('gemini') !== -1) return 'gemini';
          return 'other';
        }

        function modelFamilyRank(family) {
          if (family === 'gpt') return 0;
          if (family === 'claude') return 1;
          if (family === 'gemini') return 2;
          return 9;
        }

        function modelMainstreamScore(model) {
          var name = String(model && model.model_name ? model.model_name : '');
          var lower = name.toLowerCase();
          var score = Number(
            model && model.model_ratio ? model.model_ratio : 0,
          );

          if (lower.indexOf('latest') !== -1) score += 80;
          if (lower.indexOf('pro') !== -1) score += 70;
          if (lower.indexOf('opus') !== -1) score += 65;
          if (lower.indexOf('sonnet') !== -1) score += 58;
          if (lower.indexOf('flash') !== -1) score += 45;
          if (lower.indexOf('codex') !== -1) score += 42;
          if (lower.indexOf('4o') !== -1 || lower.indexOf('4.1') !== -1)
            score += 38;
          if (lower.indexOf('mini') !== -1 || lower.indexOf('haiku') !== -1)
            score += 18;
          if (lower.indexOf(':free') !== -1) score -= 90;
          if (lower.indexOf('embedding') !== -1) score -= 120;
          if (lower.indexOf('image') !== -1) score -= 60;

          return score;
        }

        function pickShowcaseModels(models) {
          var buckets = { gpt: [], claude: [], gemini: [] };
          models.forEach(function (model) {
            var family = getModelFamily(model.model_name);
            if (buckets[family]) buckets[family].push(model);
          });

          Object.keys(buckets).forEach(function (family) {
            buckets[family].sort(function (a, b) {
              return modelMainstreamScore(b) - modelMainstreamScore(a);
            });
          });

          var selected = [];
          var familyOrder = ['gpt', 'claude', 'gemini'];
          for (var index = 0; index < 5; index += 1) {
            familyOrder.forEach(function (family) {
              if (buckets[family][index]) selected.push(buckets[family][index]);
            });
          }

          return selected.slice(0, 15);
        }

        function createModelCard(model, vendors, groupRatio) {
          var card = document.createElement('article');
          card.className = 'glass-card new-api-dynamic-model-card';

          var provider = getVendorName(model, vendors);
          var group = pickPrimaryGroup(model, groupRatio || {});
          var discount = getDiscountZhe(group.ratio);
          var tags = String(model.tags || '')
            .split(',')
            .map(function (tag) {
              return tag.trim();
            })
            .filter(Boolean)
            .slice(0, 3);
          if (tags.length === 0) tags = ['文本生成', '结构化输出'];

          card.innerHTML =
            '<div>' +
            '<h3>' +
            escapeHtml(model.model_name || 'model') +
            '</h3>' +
            '<p class="new-api-model-card-provider">' +
            escapeHtml(provider) +
            '</p>' +
            '</div>' +
            '<div class="new-api-model-card-tags">' +
            tags
              .map(function (tag) {
                return '<span>' + escapeHtml(tag) + '</span>';
              })
              .join('') +
            '</div>' +
            '<div class="new-api-model-card-meta">' +
            '<div><span>模型分组</span><strong>' +
            escapeHtml(group.name) +
            '</strong></div>' +
            '<div><span>分组倍率</span><strong>' +
            formatRatio(group.ratio) +
            '</strong></div>' +
            '<div class="new-api-model-card-discount"><span>分组折扣</span><strong>' +
            (discount === null ? '-' : discount + ' 折') +
            '</strong></div>' +
            '</div>';

          return card;
        }

        function escapeHtml(value) {
          return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function renderModelShowcase(payload) {
          var section = document.querySelector('.new-api-section-models');
          if (
            !section ||
            section.getAttribute('data-new-api-model-marquee') === 'true'
          )
            return false;

          var grid = Array.prototype.slice
            .call(section.querySelectorAll('.grid'))
            .find(function (node) {
              return node.querySelector('.glass-card');
            });
          if (!grid) return false;

          var models = Array.isArray(payload && payload.data)
            ? payload.data.slice()
            : [];
          var vendors = (payload && payload.vendors) || {};
          var groupRatio = (payload && payload.group_ratio) || {};

          models = models.filter(function (model) {
            var name = String(model.model_name || '').toLowerCase();
            return (
              (name.indexOf('gpt') !== -1 ||
                name.indexOf('claude') !== -1 ||
                name.indexOf('gemini') !== -1) &&
              Array.isArray(model.supported_endpoint_types) &&
              model.supported_endpoint_types.indexOf('openai') !== -1
            );
          });
          models = pickShowcaseModels(models).sort(function (a, b) {
            var rank =
              modelFamilyRank(getModelFamily(a.model_name)) -
              modelFamilyRank(getModelFamily(b.model_name));
            if (rank !== 0) return rank;
            return modelMainstreamScore(b) - modelMainstreamScore(a);
          });

          if (models.length < 4) return false;

          var marquee = document.createElement('div');
          marquee.className = 'new-api-model-marquee';
          var track = document.createElement('div');
          track.className = 'new-api-model-track';
          models.concat(models).forEach(function (model) {
            track.appendChild(createModelCard(model, vendors, groupRatio));
          });
          marquee.appendChild(track);

          grid.replaceWith(marquee);
          section.setAttribute('data-new-api-model-marquee', 'true');
          return true;
        }

        function loadModelShowcase() {
          if (modelShowcaseLoaded) return;
          modelShowcaseLoaded = true;

          fetch('/api/pricing', { credentials: 'same-origin' })
            .then(function (response) {
              if (!response.ok) throw new Error('pricing request failed');
              return response.json();
            })
            .then(function (payload) {
              if (!renderModelShowcase(payload)) modelShowcaseLoaded = false;
            })
            .catch(function () {
              modelShowcaseLoaded = false;
            });
        }

        function isHomeAdjusted() {
          return !!(
            document.querySelector('.new-api-home-hero') &&
            document.querySelector('.new-api-gateway-card') &&
            document.querySelector('.new-api-gateway-visual') &&
            document.querySelector('.new-api-compare-table') &&
            document.querySelector('.new-api-trust-grid-primary') &&
            document.querySelector('.new-api-trust-grid-secondary')
          );
        }

        var pendingHomeAdjustment = false;
        var homeObserver = null;

        function scheduleHomeAdjustments() {
          if (pendingHomeAdjustment) return;

          pendingHomeAdjustment = true;
          requestAnimationFrame(function () {
            pendingHomeAdjustment = false;
            applyHomeAdjustments();

            if (homeObserver && isHomeAdjusted()) {
              homeObserver.disconnect();
              homeObserver = null;
            }
          });
        }

        applyHomeAdjustments();
        if (!isHomeAdjusted()) {
          homeObserver = new MutationObserver(scheduleHomeAdjustments);
          homeObserver.observe(document.body, {
            childList: true,
            subtree: true,
          });
          [250, 750, 1500].forEach(function (delay) {
            window.setTimeout(scheduleHomeAdjustments, delay);
          });
        }

          登录: '/login',

          立即体验: '/console',
          模型广场: '/pricing',

          价格方案: '/pricing',

        };

        document.addEventListener(
          'click',
          function (event) {
            var target =
              event.target && event.target.closest
                ? event.target.closest('a, button')
                : null;
            if (!target) return;

            var text = (target.textContent || '').trim();
            var route = routeMap[text];

            if (route) {
              event.preventDefault();
              event.stopPropagation();
              window.parent.postMessage(
                { type: 'new-api-home-route', route: route },
                '*',
              );
              return;
            }

            if (target.tagName === 'A' && text === '开发文档') {
              target.setAttribute('href', '/docs/bay-api/page.html');
              target.setAttribute('target', '_blank');
              target.setAttribute('rel', 'noopener noreferrer');
            }
          },
          true,
        );
      })();
    </script>
  </body>
</html>
