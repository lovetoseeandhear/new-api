# ============================================================
# 美国源站 — api.aiflowbay.com 直连专用 server block
# 路径：/etc/nginx/conf.d/api.conf
# 作用：模型 API 调用直连美国，不经香港、不缓存、支持流式与 WebSocket
# 后端：new-api 监听 127.0.0.1:3030
# ============================================================

upstream newapi_local {
    server 127.0.0.1:3030;
    keepalive 64;
}

# HTTP → HTTPS（保留 acme 验证）
server {
    listen 80;
    server_name api.aiflowbay.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name api.aiflowbay.com;

    ssl_certificate     /etc/letsencrypt/live/api.aiflowbay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aiflowbay.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 100m;        # 多模态/文件上传

    # 回源公共设置（直连本机 new-api）
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }

    # ===== WebSocket：/v1/realtime =====
    location = /v1/realtime {
        proxy_pass http://newapi_local;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ===== 流式接口：关闭缓冲，逐字返回 =====
    location ~ ^/(v1|v1beta|pg|mj|suno)(/|$) {
        proxy_pass http://newapi_local;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ===== 其余 API（/api 等）直接转发 =====
    location / {
        proxy_pass http://newapi_local;
        proxy_read_timeout 300s;
    }
}
