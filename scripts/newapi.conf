
  upstream newapi_backend {
      server 127.0.0.1:3030;
      keepalive 64;                 # 复用到后端的连接，省握手开销
  }

  server {
      listen 80;
      server_name aiflowbay.com www.aiflowbay.com;

      location ^~ /.well-known/acme-challenge/ {
          root /var/www/acme;
      }

      location / {
          return 301 https://$host$request_uri;
      }
  }

  server {
      listen 443 ssl;
      http2 on;                     # 新写法（listen ... http2 已废弃，但你旧写法也能用）
      server_name aiflowbay.com www.aiflowbay.com;

      ssl_certificate     /etc/letsencrypt/live/aiflowbay.com/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/aiflowbay.com/privkey.pem;
      ssl_protocols       TLSv1.2 TLSv1.3;
      ssl_session_cache   shared:SSL:10m;
      ssl_session_timeout 1d;

      client_max_body_size 100m;    # 20m 对文件/多模态上传偏小，建议放大

      # 后端已自带 gzip，这里留作兜底（nginx 不会二次压缩已编码内容）
      gzip on;
      gzip_comp_level 6;
      gzip_min_length 1024;
      gzip_vary on;
      gzip_proxied any;
      gzip_types
          text/plain text/css text/xml
          application/javascript application/x-javascript
          application/json application/xml application/rss+xml
          image/svg+xml font/woff font/woff2;

      # 复用后端连接所需
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # 隐藏 .git 等
      location ~ /\.(?!well-known) {
          return 404;
          access_log off;
          log_not_found off;
      }

      # ========== 1) 后台 SPA 哈希资产：1 年 immutable（解决 /console /pricing 二次进入卡顿）==========
      location ^~ /assets/ {
          proxy_pass http://newapi_backend;
          proxy_hide_header Cache-Control;          # 干掉后端的 no-cache
          proxy_hide_header Pragma;
          add_header Cache-Control "public, max-age=31536000, immutable" always;
      }

      # ========== 2) 首页静态资产：1 年 immutable（你之前漏了这条！）==========
      location ^~ /home/assets/ {
          proxy_pass http://newapi_backend;
          proxy_hide_header Cache-Control;
          proxy_hide_header Pragma;
          add_header Cache-Control "public, max-age=31536000, immutable" always;
      }

      # ========== 3) 供应商图标 ==========
      location ^~ /vendor-icons/ {
          proxy_pass http://newapi_backend;
          proxy_hide_header Cache-Control;
          proxy_hide_header Pragma;
          add_header Cache-Control "public, max-age=2592000, immutable" always;
      }

      # ========== 4) 带 hash 的静态后缀兜底（字体/图片/map 等）==========
      location ~* \.(?:js|mjs|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico|map)$ {
          proxy_pass http://newapi_backend;
          proxy_hide_header Cache-Control;
          add_header Cache-Control "public, max-age=2592000" always;   # 30 天
      }

      # ========== 5) 流式接口：关闭缓冲，避免对话"卡住转圈" ==========
      location ~ ^/(v1|v1beta|pg|mj|suno)(/|$) {
          proxy_pass http://newapi_backend;
          proxy_buffering off;          # SSE 必须关
          proxy_cache off;
          proxy_read_timeout 600s;      # 长响应/大模型慢回包
          proxy_send_timeout 600s;
          chunked_transfer_encoding on;
      }

      # ========== 6) API：不缓存，正常转发 ==========
      location ^~ /api/ {
          proxy_pass http://newapi_backend;
          proxy_read_timeout 300s;
          proxy_hide_header Cache-Control;
          add_header Cache-Control "no-cache" always;
      }

      # ========== 7) HTML 入口：no-cache（保证发版后拿到指向新 hash 的页面）==========
      location = /index.html {
          proxy_pass http://newapi_backend;
          proxy_hide_header Cache-Control;
          add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      }

      # ========== 8) 其余 SPA 路由（/console /pricing /login ...）==========
      location / {
          proxy_pass http://newapi_backend;
          proxy_hide_header Cache-Control;
          add_header Cache-Control "no-cache" always;
      }
  }
